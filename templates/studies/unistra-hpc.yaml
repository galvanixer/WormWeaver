# Edit account-specific paths before calling generate_study("unistra-hpc.yaml").
# Generates 60 simulations: 3 (extent, beta) pairs x 2 mu vectors x 10 replicas.
# Scratch paths must be absolute, without spaces; ~ and $HOME are not expanded.
project: LRBHQM  # Any nonempty project name.
output_dir: /home2020/home/isis/tgupta/Study/LRBHQM/LRBHQM_test  # Generation path; may differ from jobs.run_dir.

# append_date: false  # true (default, adds _YYYY-MM-DD) or false.
# template: ./config.yaml  # Bundled filename or custom path; default: config.yaml.

multiwormqmc_path: /home2020/home/isis/tgupta/Code/multiwormqmc.jl  # Local checkout for provenance; omit to auto-discover.

# Constants applied to every simulation.
overrides:
  run.blocks: 100
  run.samples_per_block: 10000
  run.burnin_blocks: 10

# All combinations of independent values and correlated groups are generated.
sweep:
  model.onsite.mu:
    - [1.0, 1.0]
    - [2.0, 2.0]

# Fields within each group advance together; lists must be nonempty and equal-length.
correlated_sweeps:
  - lattice.extent: [[16], [32], [64]]
    system.beta: [2.0, 4.0, 8.0]

replicas: 10  # Any positive integer; omit for one simulation per combination.
seed_generation_seed: 12345  # Nonnegative integer; omit for fresh random seeds each generation.
randomize_seeds:  # Nonempty subset of the paths below; default: [run.seed].
  - run.seed
  - worldlines.init_seed
  # - model.disorder.seed

jobs:
  mode: scratch  # direct (default) or scratch.
  command:  # Argument list; default: [multiwormqmc].
    - julia
    - /home2020/home/isis/tgupta/Code/multiwormqmc.jl/bin/multiwormqmc.jl
  run_dir: /home2020/home/isis/tgupta/Study/LRBHQM/LRBHQM_test  # Absolute execution path; omit to use the generated study directory.
  scratch_root: /scratch  # Any absolute directory; only for scratch mode.

# Requires hpc_multilauncher and an existing /scratch/job.$SLURM_JOB_ID directory.
# Submit one generated account .slurm script from the study directory.
