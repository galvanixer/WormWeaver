# Edit output_dir, then call generate_study("study.yaml").
# Generates 60 simulations: 3 (extent, beta) pairs x 2 mu vectors x 10 replicas.
project: RFEBHM  # Any nonempty project name.
output_dir: /path/to/my_study  # Absolute path or relative to this file.

# template: ./config.yaml  # Bundled filename or custom path; default: config.yaml.
# append_date: false  # true (default, adds _YYYY-MM-DD) or false.

# Use existing config paths; no duplicates or parent/child overlaps across sections.
# Constants applied to every simulation.
overrides:
  run.blocks: 100
  run.samples_per_block: 10000

# All combinations of independent values and correlated groups are generated.
# Each inner array is one complete parameter value.
sweep:
  model.onsite.mu:
    - [1.0, 1.0]
    - [2.0, 2.0]

# Fields within each group advance together; lists must be nonempty and equal-length.
correlated_sweeps:
  - lattice.extent: [[16], [32], [64]]
    system.beta: [16.0, 32.0, 64.0]

# Replicas per combination; randomizes run.seed by default.
replicas: 10  # Any positive integer; omit for one simulation per combination.
randomize_seeds: [run.seed, worldlines.init_seed, model.disorder.seed]  # Any nonempty subset; default: [run.seed].
seed_generation_seed: 12345  # Nonnegative integer; omit for fresh random seeds each generation.

# Optional execution settings.
jobs:
  mode: direct  # direct (default) or scratch.
  command: [multiwormqmc]  # Argument list, e.g. [julia, /path/to/bin/multiwormqmc.jl].
  run_dir: /cluster/path/to/study  # Absolute execution path; omit to use the generated study directory.
  # scratch_root: /scratch  # Any absolute directory; only for scratch mode.
